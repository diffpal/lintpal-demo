name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - run: go test ./...
      - run: go vet ./...
      - name: Install released LintPal
        run: go install github.com/diffpal/lintpal/cmd/lintpal@v0.4.1
      - name: Validate repository rules
        run: lintpal rule validate
